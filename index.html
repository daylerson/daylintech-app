<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1C3D">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DaylinTech">
</head>
<body>
<title>DaylinTech Orçamentos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: faixa azul-marinho da marca com cortes diagonais azul e laranja (como no material da DaylinTech); conteúdo em coluna única até 1080px; barra de abas inferior no celular; proposta como "folha de papel" fixa clara. */
:root{
  --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#F4F7FB; --ink:#0B1A33; --muted:#5B6A80; --line:#E3E8EF;
  --band:#FFFFFF; --band-ink:#0A1C3D; --band-muted:#5B6A80; --band-tech:#1452B0;
  --brand:#1452B0; --brand-soft:#EAF1FC;
  --accent:#F07A12; --accent-ink:#FFFFFF; --accent-soft:#FEF0E3;
  --ok:#1E8A52; --ok-soft:#E3F5EA; --info:#1452B0; --info-soft:#EAF1FC; --bad:#C2392F; --bad-soft:#FBE7E4; --neutral-soft:#EEF2F6;
  --paper:#FFFFFF; --paper-ink:#0B1A33; --paper-muted:#5B6A80; --paper-line:#E3E8EF; --paper-band:#0A1C3D; --paper-accent:#F07A12; --paper-blue:#1452B0; --paper-soft:#F4F7FB;
  --shadow:0 1px 2px rgba(16,40,80,.04),0 4px 14px rgba(16,40,80,.05);
  --f-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:light;
}
/* Tema único claro, escolhido pelo cliente: o app fica branco mesmo com o celular no modo escuro. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.02em}

/* Cabeçalho */
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.band::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand) 0 70%,var(--accent) 70% 100%);pointer-events:none}
.band-in{position:relative;z-index:1}
.band-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--accent)}
.brand-mark img{width:34px;height:auto;display:block}
.brand-name{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand-name b{color:var(--band-tech);font-weight:800}
.brand-sub{font-size:12px;letter-spacing:.04em;color:var(--band-muted);margin-top:3px}
.toptabs{display:flex;gap:4px}
.toptabs button{background:none;border:0;color:var(--band-muted);padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.toptabs button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.toptabs button:hover{color:var(--band-ink)}
.present{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--band-muted);cursor:pointer;user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px}
.switch{width:36px;height:20px;border-radius:20px;background:#C9D3E0;position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.present[aria-pressed="true"] .switch{background:var(--accent)}
.present[aria-pressed="true"] .switch::after{transform:translateX(16px)}
.present[aria-pressed="true"]{color:var(--band-ink)}
@media (max-width:760px){.present{font-size:12px}}

/* Navegação inferior (celular) */
.bottomnav{display:none}
@media (max-width:760px){
  .toptabs{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .bottomnav button[aria-current="page"]{color:var(--accent)}
  .bottomnav svg{width:22px;height:22px}
  .bottomnav button{white-space:nowrap;font-size:9.5px;letter-spacing:-.03em;padding-left:1px;padding-right:1px;overflow:hidden;text-overflow:ellipsis}
  .qty{justify-self:start}
  main{padding-bottom:84px!important}
}

main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
.h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn svg{width:16px;height:16px}

/* Métricas */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}
.stat{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats .stat:first-child{border-top-color:var(--accent)}
.stat .s{font-size:12.5px;color:var(--muted)}

/* Chips e busca */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.li .d{font-size:13px;color:var(--muted);min-width:0}
.li .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.st-rascunho{background:var(--neutral-soft);color:var(--muted)}
.st-enviado{background:var(--info-soft);color:var(--info)}
.st-aprovado{background:var(--ok-soft);color:var(--ok)}
.st-recusado{background:var(--bad-soft);color:var(--bad)}

/* Catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--muted)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.ico{width:40px;height:40px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.card .t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card .d{font-size:12.5px;color:var(--muted)}
.price{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.price small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.cost{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.marg{font-weight:700}
.marg.lo{color:var(--bad)} .marg.mid{color:var(--accent)} .marg.hi{color:var(--ok)}
body.apresentacao .internal{display:none!important}
.catsec{display:flex;flex-direction:column;gap:10px}

/* Empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-size:16px}

/* Formulários */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field textarea{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(6,12,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin-right:auto}
.sheet-b{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-b>*{flex-shrink:0}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.sheet-f .left{margin-right:auto}

/* Editor de orçamento */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:860px){.ed{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .t{font-weight:600;overflow-wrap:anywhere}
.it .d{font-size:12.5px;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:32px;height:32px;border:0;background:var(--surface-2);cursor:pointer;font-weight:700}
.qty input{width:52px;height:32px;border:0;text-align:center;background:var(--surface);font-variant-numeric:tabular-nums}
.it .sum{font-weight:700;text-align:right;min-width:92px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.it{grid-template-columns:1fr auto}.it .info{grid-column:1/-1}}
.totals{display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.totals .ln{display:flex;justify-content:space-between;gap:10px}
.totals .grand{border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;align-items:baseline}
.totals .grand span:last-child{font-family:var(--f-display);font-size:25px;font-weight:800;color:var(--brand)}
.profit{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.sticky{position:sticky;top:12px}

/* Picker */
.pk{display:flex;flex-direction:column}
.pk-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.pk-i:hover{background:var(--surface-2)}
.pk-i .ico{width:34px;height:34px}
.pk-i .ico svg{width:18px;height:18px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}

/* Proposta (folha) */
.paper-wrap{overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(10,20,35,.12);max-width:820px;margin:0 auto;overflow:hidden}
.pp-band{background:var(--paper);color:var(--paper-ink);padding:22px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.pp-band::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:linear-gradient(115deg,transparent 0 30%,var(--paper-soft) 30% 100%);pointer-events:none}
.pp-band>*{position:relative;z-index:1}
.pp-id{display:flex;align-items:center;gap:14px}
.pp-logo{width:68px;height:68px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 3px var(--paper-accent)}
.pp-brand{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.pp-brand{color:var(--paper-band)}
.pp-brand b{color:var(--paper-blue)}
.pp-sub{font-size:12px;color:var(--paper-muted);margin-top:6px;max-width:340px}
.pp-num{text-align:right}
.pp-num .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-muted)}
.pp-num .n{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1;color:var(--paper-blue)}
.pp-stripe{height:5px;background:linear-gradient(90deg,var(--paper-blue) 0 62%,var(--paper-accent) 62% 100%)}
.pp-body{padding:24px 28px;display:flex;flex-direction:column;gap:22px}
.pp-meta{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:560px){.pp-meta{grid-template-columns:1fr}.pp-body,.pp-band{padding-left:18px;padding-right:18px}}
.pp-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-blue);margin-bottom:4px}
.pp-cli{font-size:18px;font-weight:700}
.pp-small{font-size:13px;color:var(--paper-muted)}
.pp-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pp-cat{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-band);border-bottom:2px solid var(--paper-blue);padding-bottom:6px}
.pp-cat svg{width:18px;height:18px;color:var(--paper-blue)}
.pp-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.pp-table td{padding:9px 0;border-bottom:1px solid var(--paper-line);vertical-align:top}
.pp-table td.q{width:60px;color:var(--paper-muted);white-space:nowrap}
.pp-table td.v{text-align:right;white-space:nowrap;padding-left:12px}
.pp-table .desc{font-size:12.5px;color:var(--paper-muted)}
.pp-tot{align-self:flex-end;width:min(340px,100%);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.pp-tot .ln{display:flex;justify-content:space-between}
.pp-tot .g{background:var(--paper-soft);color:var(--paper-band);border-radius:6px;padding:12px 14px;margin-top:6px;align-items:baseline}
.pp-tot .g{border-left:6px solid var(--paper-accent)}
.pp-tot .g span:last-child{font-family:var(--f-display);font-size:25px;font-weight:800;color:var(--paper-blue)}
.pp-cond{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;background:var(--paper-soft);border-radius:6px;padding:14px 16px;font-size:13.5px}
.pp-foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end;font-size:12.5px;color:var(--paper-muted);border-top:1px solid var(--paper-line);padding-top:16px}
.sign{width:220px;border-top:1px solid var(--paper-ink);padding-top:6px;text-align:center;color:var(--paper-ink)}
.actions{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (max-width:760px){.actions{position:static}}

/* Produto: foto, datasheet, preço */
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;border:1px solid var(--line);background:#fff;flex:none;display:block}
.pk-i .thumb{width:34px;height:34px}
.ds{font-size:12.5px;font-weight:600;color:var(--brand);text-decoration:none;white-space:nowrap}
.ds:hover{text-decoration:underline}
.fotobox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:center}
.fotobox.dz{border:1.5px dashed var(--line);border-radius:12px;padding:10px;transition:border-color .15s,background .15s}
.fotobox.dz.over{border-color:var(--brand);background:var(--brand-soft)}
.fprev{grid-row:span 2;width:76px;height:76px;border-radius:12px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--brand)}
.fprev img{width:100%;height:100%;object-fit:cover}
.fprev svg{width:30px;height:30px}
.pricebox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.break{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.break .ln,.hist .ln{display:flex;justify-content:space-between;gap:10px}

.buy-l .d{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.buy-l .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.buy-l.done .t,.buy-l.done .v{text-decoration:line-through;color:var(--muted)}
/* Importação */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600;max-width:100%;overflow-wrap:anywhere}
.fchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0 6px}
.working{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 10px;text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:0}
.imp-sum{display:flex;flex-direction:column;gap:6px}
.imp-list{display:flex;flex-direction:column;gap:10px}
.imp-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.imp-row.off{opacity:.55}
.imp-row .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.imp-row .d{font-size:12.5px;color:var(--muted)}
.imp-row select,.imp-row input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.imp-cmp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.imp-new{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
.imp-new .full{grid-column:1/-1}
@media (max-width:480px){.imp-new{grid-template-columns:1fr}}
.delta{font-size:12px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--neutral-soft);color:var(--muted)}
.delta.up{background:var(--bad-soft);color:var(--bad)}
.delta.down{background:var(--ok-soft);color:var(--ok)}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.conf-alta{background:var(--ok-soft);color:var(--ok)}
.conf-media{background:var(--info-soft);color:var(--info)}
.conf-baixa{background:var(--accent-soft);color:var(--accent)}
/* Proposta: foto e datasheet */
.pp-table td.ph{width:64px;padding-right:12px}
.pp-ph{width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid var(--paper-line);display:block;background:#fff}
.pp-ph.ic{display:grid;place-items:center;color:var(--paper-blue);background:var(--paper-soft);border-color:transparent}
.pp-ph.ic svg{width:22px;height:22px}
.pp-unit{font-size:12.5px;color:var(--paper-muted);margin-top:2px}
.pp-ds{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--paper-blue);text-decoration:none;border:1px solid var(--paper-line);border-radius:999px;padding:3px 10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:24px}}
.loading{padding:40px;text-align:center;color:var(--muted)}
body.bloqueado .gear,body.bloqueado .present{display:none}
a.btn{text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.acesso{max-width:420px;margin:24px auto 0;display:flex;flex-direction:column;gap:14px;width:100%}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function carregarTudo(){
  const out=[];
  for(let de=0;;de+=1000){
    const {data,error}=await sb.from('docs').select('col,id,data').order('col').order('id').range(de,de+999);
    if(error)throw error;out.push(...data);if(data.length<1000)return out;
  }
}
// Mesmo formato do banco do artefato (collection/doc/onSnapshot), para o resto do app não mudar.
function nuvemDb(linhas){
  let cache={};const subs={};
  const put=r=>{(cache[r.col]=cache[r.col]||{})[r.id]=r.data};
  const tira=(c,id)=>{if(cache[c])delete cache[c][id]};
  const fire=c=>(subs[c]||[]).forEach(f=>f());
  const ouvir=(c,f)=>{(subs[c]=subs[c]||[]).push(f);f()};
  const ok=({error})=>{if(error)throw error};
  const docSnap=(c,id)=>{const d=cache[c]&&cache[c][id];return {exists:!!d,data:()=>d}};
  const ref=(c,id)=>({
    async set(data){ok(await sb.from('docs').upsert({col:c,id,data}));put({col:c,id,data});fire(c)},
    async delete(){ok(await sb.from('docs').delete().eq('col',c).eq('id',id));tira(c,id);fire(c)},
    onSnapshot(f){ouvir(c,()=>f(docSnap(c,id)))}
  });
  const trocarTudo=ls=>{cache={};ls.forEach(put);Object.keys(subs).forEach(fire)};
  linhas.forEach(put);
  sb.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.col){tira(o.col,o.id);fire(o.col)}}
    else if(p.new&&p.new.col){
      const antes=cache[p.new.col]&&cache[p.new.col][p.new.id],ac=p.new.data&&p.new.data.aceite;
      const novoAceite=p.new.col==='orcamentos'&&ac&&ac.via==='link'&&!(antes&&antes.aceite);
      put(p.new);fire(p.new.col);if(novoAceite)setTimeout(()=>avisoAceite(p.new.id),50)}
  }).subscribe();
  // Se a conexão ao vivo cair, recarrega tudo ao voltar para o app.
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible')return;try{trocarTudo(await carregarTudo())}catch(e){}});
  return {
    collection:c=>({doc:id=>ref(c,id),onSnapshot:f=>ouvir(c,()=>f({docs:Object.values(cache[c]||{}).map(d=>({data:()=>d}))}))}),
    doc:path=>{const [c,id]=path.split('/');return ref(c,id)},
    vazio:()=>!Object.values(cache).some(x=>Object.keys(x).length),
    // Substitui tudo pelo conteúdo de um backup.
    async importar(bk){
      const cols=['produtos','clientes','orcamentos'],ls=[];
      cols.forEach(c=>(Array.isArray(bk[c])?bk[c]:[]).filter(x=>x&&x.id).forEach(x=>ls.push({col:c,id:String(x.id),data:x})));
      ls.push({col:'config',id:'empresa',data:bk.empresa||{}});
      for(let i=0;i<ls.length;i+=200)ok(await sb.from('docs').upsert(ls.slice(i,i+200)));
      for(const c of cols){const ids=new Set(ls.filter(r=>r.col===c).map(r=>r.id));const sobra=Object.keys(cache[c]||{}).filter(id=>!ids.has(id));
        for(let i=0;i<sobra.length;i+=200)ok(await sb.from('docs').delete().eq('col',c).in('id',sobra.slice(i,i+200)))}
      trocarTudo(ls);
    }
  };
}

function calc(o){
  const sub=(o.itens||[]).reduce((s,i)=>s+num(i.preco)*num(i.qtd),0);
  const custo=(o.itens||[]).reduce((s,i)=>s+num(i.custo)*num(i.qtd),0);
  const desc=sub*num(o.descontoPct)/100;
  const total=sub-desc;
  const {imp,desp}=taxas();const tx=total*(imp+desp)/100;
  const its=o.itens||[],mo=its.filter(isMO).reduce((t,i)=>t+num(i.preco)*num(i.qtd),0);
  const tempo=its.filter(isMO).reduce((t,i)=>{const pr=S.produtos.find(x=>x.id===i.produtoId);return t+num(i.tempo!=null&&i.tempo!==''?i.tempo:pr&&pr.tempo)*num(i.qtd)},0);

function lerFoto(file,max=240){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',XLSX_SRC='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&loadScript.ok[src]){res();return}const el=document.createElement('script');el.src=src;el.onload=()=>{loadScript.ok[src]=1;res()};el.onerror=()=>rej(new Error('script'));document.head.appendChild(el)})}
loadScript.ok={};
function paraJpeg(file,max=2000){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.88)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}
async function getSample(){if(sb)return nuvemLeitor;try{return window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){return null}}
// Leitura de cotação fora do Claude: função "ler-cotacao" no Supabase (supabase/functions/ler-cotacao), que guarda a chave da Anthropic.
// Mesmo formato do leitor do artefato (limits() e json()), para lerCotacao() não mudar.
const nuvemLeitor={
  async limits(){return {images:{maxCount:5}}},
  async json(prompt,opts={}){
    const imagens=await Promise.all((opts.images||[]).map(async b=>(await blobDataURL(b)).split(',')[1]));
    const {data,error}=await sb.functions.invoke('ler-cotacao',{body:{prompt,imagens},signal:opts.signal});
    if(opts.signal&&opts.signal.aborted)throw {code:'cancelled'};
    if(error){let code='falha';
      try{const r=error.context;if(r&&r.status===404)code='nao_instalada';else if(r&&r.json){const j=await r.json();code=j.erro||code}}catch(e){}
      if(error.name==='FunctionsFetchError')code='sem_conexao';
      throw {code};
    }
    if(!data||!data.dados)throw {code:'invalid_json'};
    return data.dados;
  }
};
async function pdfLer(file,maxImg){
  await loadScript(PDFW);await loadScript(PDFJS);
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let text='';
  for(let i=1;i<=Math.min(doc.numPages,15);i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const rows={};
    tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
    text+=Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(t=>t.str).join('  ')).join('\n')+'\n\n'}
  if(text.replace(/\s/g,'').length>80)return {text};
  const images=[];
  for(let i=1;i<=Math.min(doc.numPages,maxImg||0);i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;images.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.9)))}
  return {images};
}

function ocrWorker(){
  if(!ocrW)ocrW=(async()=>{await loadScript(TESS_SRC);const w=await window.Tesseract.createWorker('por',1,{...TESS_OPTS,logger:m=>ocrLog&&ocrLog(m)});

// Prepara a foto: print pequeno é ampliado (o OCR erra muito com letra miúda), foto enorme é reduzida, tons de cinza com mais contraste.
async function prepOCR(blob){
  const bmp=await createImageBitmap(blob),w=bmp.width,h=bmp.height;
  let k=w<1400?1600/w:w>2400?2200/w:1;if(h*k>4500)k=4500/h;
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d');
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.filter='grayscale(1) contrast(1.2)';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();return c;
}
async function ocrImagens(imgs,aviso){
  ocrLog=m=>{if(/load|initiali/i.test(m.status||''))aviso('Preparando o leitor de fotos…'+(m.progress?` ${Math.round(m.progress*100)}%`:''))};
  let t='';
  try{const w=await ocrWorker();
    for(let i=0;i<imgs.length;i++){const rot=imgs.length>1?`Lendo a foto ${i+1} de ${imgs.length}…`:'Lendo a foto…';aviso(rot);
      ocrLog=m=>{if(m.status==='recognizing text')aviso(`${rot} ${Math.round((m.progress||0)*100)}%`)};
      const {data}=await w.recognize(await prepOCR(imgs[i]));t+='\n'+data.text}}
  finally{ocrLog=null}
  return t;
}

function nomeBonito(desc,cod){
  let t=String(desc||'').replace(/\b[CSP]\/\s*/gi,m=>({c:'com ',s:'sem ',p:'para '}[m[0].toLowerCase()])).replace(/[_|]+/g,' ').replace(/\s+/g,' ').trim();
  const toks=t.split(' ').filter(Boolean),saida=[];let marca='';
  for(let i=0;i<toks.length;i++){let w=toks[i];const n=normNome(w).replace(/[^a-z0-9-]/g,'');
    if(cod&&w===cod)continue;
    if(/^\d{7,14}$/.test(w))continue;                                   // código de barras
    if(/^(p[cç]s?|pe[cç]as?|un|und|unid|unids|unidades?)\.?$/i.test(w))continue; // unidade de venda
    if(MARCAS[n]){if(!marca)marca=MARCAS[n];continue}
    saida.push(w)}
  const out=saida.map((w,i)=>{const n=normNome(w).replace(/[^a-z0-9]/g,''),prox=saida[i+1]||'',ant=saida[i-1]||'';
    const m=w.match(/^(\d+(?:[.,]\d+)?)(m|mm|cm|mts?|metros?)$/i);if(m)return m[1]+' '+(/^mm$/i.test(m[2])?'mm':/^cm$/i.test(m[2])?'cm':'m');
    if(/\d/.test(w))return w.toUpperCase().replace(/(\d)V$/,'$1V').replace(/(\d)AH$/,'$1Ah').replace(/(\d)MP$/,'$1MP');
    if(SIGLA_FORMA[n])return SIGLA_FORMA[n];
    if(SIGLAS.has(n))return w.toUpperCase();
    // letras do modelo: "VHD 1220 B", "SIR 1000 PT", "VB 301 P"
    if(/^[A-Za-z]{2,4}$/.test(w)&&w===w.toUpperCase()&&/^\d{2,5}$/.test(prox)&&!ACENTOS[n])return w;
    if(/^[A-Za-z]{1,2}$/.test(w)&&w===w.toUpperCase()&&/\d/.test(ant))return w;
    const low=w.toLowerCase();return ACENTOS[n]||low});
  let nome=out.join(' ').replace(/\s+/g,' ').trim();nome=nome.charAt(0).toUpperCase()+nome.slice(1);
  // Modelo: letras + número (+ letras curtas), ex.: VHD 1220 B, MHDX 1108, XB1270
  const mm=nome.match(/\b([A-Z]{2,5}-?\s?\d{2,5}(?:[\s-](?:[A-Z]{1,3}\d?|G\d|\d{1,3}))*)\b/);
  return {nome,marca,modelo:mm?mm[1].trim():''};
}

function catGratis(t){t=normNome(t);

    /interfone|porteiro|videoporteiro|monofone/.test(t)?'interfones':/fechadura|leitor biom|controle de acesso|\btag\b|cartao rfid/.test(t)?'fechaduras':

// Corrige trocas comuns do OCR dentro de números (O→0, l/I/|→1, S→5) e espaços no meio do valor.
const numOCR=l=>l.replace(/(?<![A-Za-z])[\dOoIl|S](?:[\dOoIl|S]|[.,]\s?(?=[\dOo]))*[.,]\s?[\dOoIl|S]{2}(?![\dA-Za-z])/g,t=>/\d/.test(t)?t.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/\s/g,''):t);

function lerTextoCotacao(txt,produtos){
  const RS=/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})+,\d{2}|\d{1,3}(?:,\d{3})+\.\d{2}|\d+[,.]\d{2})(?![\d,.]?\d)|R\$\s*(\d{1,3}(?:\.\d{3})+|\d+)(?![\d,.])/g;
  const pula=/\b(sub-?total|total|desconto|impostos?|icms|ipi total|base de c[aá]lculo|troco|pagamento|parcelas?|vencimento|validade|cnpj|cpf|telefone|fone|whatsapp|e-?mail|endere[cç]o|cep|or[cç]amento n|pedido n|data)\b/i;
  const so=t=>normNome(t).replace(/[^a-z0-9]/g,'');
  const palavras=t=>normNome(t).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!/^(com|para|sem|und|unid|pcs|cxa)$/.test(w));
  const cat=(produtos||[]).filter(p=>p&&p.nome).map(p=>({p,chaves:[p.codigo,p.modelo].filter(k=>k&&so(k).length>=4).map(so),pal:palavras(p.nome+' '+(p.marca||'')+' '+(p.modelo||''))}));
  const itens=[];let frete=null,pend='';
  for(let l of String(txt||'').split(/\r?\n/)){
    l=numOCR(l.replace(/\s+/g,' ').trim());if(!l)continue;
    const ms=[...l.matchAll(RS)];
    if(!ms.length){if(/[a-zA-ZÀ-ú]{3}/.test(l)&&!pula.test(l))pend=l;continue}
    if(/\bfrete\b/i.test(l)){const m=ms[ms.length-1];frete=valorBR(m[1]||m[2]);pend='';continue}
    if(pula.test(l)){pend='';continue}

    let resto=l.replace(RS,' ').replace(/R\$/g,' ');
    // Código: a primeira palavra se for número longo ou letras+números (ex.: 778899, FT1210); senão, a primeira com letras e números.
    const pri=(resto.match(/^\s*(\S+)/)||[])[1]||'';
    let cod=/^\d{5,13}$/.test(pri)||(/^[A-Za-z0-9][A-Za-z0-9.\/-]{3,}$/.test(pri)&&/\d/.test(pri)&&/[A-Za-z]/.test(pri))||(/^[A-Z0-9]{2,6}-[A-Z0-9]{1,4}$/.test(pri)&&resto.trim().length>pri.length+3)?pri:'';
    if(!cod){const c=resto.match(/\b(?=[A-Za-z0-9.\/-]*\d)(?=[A-Za-z0-9.\/-]*[A-Za-z])[A-Za-z0-9][A-Za-z0-9.\/-]{3,}\b/);if(c)cod=c[0]}
    // Candidatos a quantidade: números soltos ou com unidade (10x, 2 un, 50 pç, 100m).
    const cands=[];const QR=/(?:^|[\s(])(?:qtd?e?\.?\s*:?\s*)?(\d{1,4})(\s*(?:x|un|und|unid|p[cç]s?|cx|mts?|m|kits?|rolos?)\.?)?(?![\w%,.\/-]|[cç])/gi;
    for(const m of resto.matchAll(QR)){const n=+m[1];if(n>0&&m[1]!==cod)cands.push({n,txt:m[0],un:!!m[2],i:m.index})}
    let qtd=null,unit,usado=null;
    if(vals.length>=2){const a=vals[vals.length-2],b=vals[vals.length-1],fecha=n=>Math.abs(a*n-b)<=Math.max(0.05,b*0.005);
      usado=cands.find(x=>fecha(x.n));unit=a;
      if(usado)qtd=usado.n;else if(a>0&&b>=a&&Math.abs(b/a-Math.round(b/a))<0.005)qtd=Math.round(b/a);
      else{usado=cands.find(x=>x.un)||null;qtd=usado?usado.n:1}}
    else{unit=vals[0];usado=cands.find(x=>x.un&&/x|un|und|unid|p[cç]|cx|kit/i.test(x.txt))||cands.find(x=>/^\s*\d/.test(x.txt)&&resto.trim().startsWith(String(x.n)))||null;qtd=usado?usado.n:1}
    if(usado)resto=resto.slice(0,usado.i)+' '+resto.slice(usado.i+usado.txt.length);
    if(cod&&resto.trim().startsWith(cod))resto=resto.trim().slice(cod.length);

    if(!/[a-zA-ZÀ-ú]{3}/.test(desc.replace(cod,''))&&pend)desc=(pend+' '+desc).trim();
    pend='';
    if(!/[a-zA-ZÀ-ú]{3}/.test(desc))continue;
    const linha=so(l+' '+desc);let melhor=null,conf='baixa';
    for(const x of cat){if(x.chaves.some(k=>linha.includes(k))){melhor=x.p;conf='alta';break}}

      novo:melhor?null:(()=>{const nb=nomeBonito(desc,cod);return {nome:nb.nome.slice(0,80),categoria:catGratis(desc),marca:nb.marca,modelo:nb.modelo||(cod&&/[A-Za-z]/.test(cod)&&/\d/.test(cod)?cod:''),
        unidade:/\b\d+\s*(mts?|m|metros?)\b/i.test(l.replace(desc,''))?'m':/\bp[cç]s?\b|pe[cç]a/i.test(l)?'pç':/\bkits?\b/i.test(l)?'kit':'un'}})()});
  }
  return {distribuidora:null,frete,itens};
}

  const itens=(res&&Array.isArray(res.itens)?res.itens:[]).filter(i=>i&&num(i.custoUnitario)>0);
  if(!itens.length){importarCotacao('Não encontrei itens com preço nessa cotação. Confira o arquivo ou cole o texto.');return}

}
function revisarImport(R){
  const byId=id=>S.produtos.find(p=>p.id===id);
  R.itens.forEach(i=>{
    i.qtd=num(i.qtd)||1;i.custoUnitario=num(i.custoUnitario);i.descricao=String(i.descricao||'Item sem descrição');i.codigo=i.codigo&&i.codigo!=='null'?String(i.codigo):'';
    const p=i.produtoId&&byId(i.produtoId);i.acao=p?'match':'novo';if(!p)i.produtoId='';
    const n=i.novo||{};i.nomeNovo=String(n.nome||i.descricao);i.catNovo=CATS.some(c=>c.id===n.categoria)?n.categoria:'acessorios';i.unNovo=UNIDADES.includes(n.unidade)?n.unidade:'un';i.marcaNovo=String(n.marca||'');i.modeloNovo=String(n.modelo||'');
    i.atualizaPreco=p?!p.precoManual:true;
  });
  R.rateio=R.frete>0;
  const opts=[...S.produtos].sort((a,b)=>a.nome.localeCompare(b.nome));
  const custoEf=i=>{if(!R.rateio||!(R.frete>0)||i.acao==='ignorar')return i.custoUnitario;const base=R.itens.filter(x=>x.acao!=='ignorar').reduce((t,x)=>t+x.custoUnitario*x.qtd,0);return base>0?i.custoUnitario*(1+R.frete/base):i.custoUnitario};
  const CONF={alta:'mesmo modelo',media:'parecido',baixa:'conferir'};
  const lojaNome=()=>R.distribuidora||'Distribuidora';
  const simular=(p,ce)=>{const agora=new Date().toISOString();const fs=(p.fornecedores||[]).map(f=>({...f}));const k=fs.findIndex(f=>normNome(f.nome)===normNome(lojaNome()));const anterior=k>=0?num(fs[k].preco):0;
    if(k>=0){fs[k].preco=ce;fs[k].data=agora}else fs.push({id:uid(),nome:lojaNome(),preco:ce,link:'',data:agora});
    return {fs,anterior,ef:fornEf({fornecedores:fs,fornecedorFixo:p.fornecedorFixo})}};
  const row=(i,ix)=>{
    const p=i.acao==='match'&&byId(i.produtoId),ce=custoEf(i);
    const sel=`<select data-imsel="${ix}" aria-label="Produto do catálogo"><option value="__novo" ${i.acao==='novo'?'selected':''}>+ Cadastrar como produto novo</option><option value="__ign" ${i.acao==='ignorar'?'selected':''}>Não importar</option><optgroup label="Seu catálogo">${opts.map(o=>`<option value="${o.id}" ${i.acao==='match'&&i.produtoId===o.id?'selected':''}>${esc(o.nome)}</option>`).join('')}</optgroup></select>`;
    let det='';
    if(p){const sim=simular(p,ce),nc=num(sim.ef.f.preco),nv=i.atualizaPreco?precoSugerido(nc,margemDe(p)):num(p.preco);const ant=sim.anterior;const d=ant>0?(ce-ant)/ant*100:null;
      const outras=sim.ef.lista.filter(f=>normNome(f.nome)!==normNome(lojaNome())).sort((a,b)=>num(a.preco)-num(b.preco));
      det=`<div class="imp-cmp"><span class="muted">${esc(lojaNome())}</span><span>${ant>0?`${money(ant)} → `:'<span class="pill conf-media">loja nova</span> '}<b>${money(ce)}</b> ${d===null?'':`<span class="delta ${d>0.05?'up':d<-0.05?'down':''}">${d>0?'+':''}${d.toFixed(1).replace('.',',')}%</span>`}</span>
        ${outras.map(f=>`<span class="muted">${esc(f.nome)}</span><span>${money(f.preco)} ${idadePill(diasDesde(f.data))}</span>`).join('')}
        <span class="muted">Custo usado</span><span>${money(p.custo)} → <b>${money(nc)}</b> <span class="hint">(${esc(sim.ef.f.nome)}${sim.ef.fixo?', escolhida por você':sim.ef.n>1?', a mais barata':''})</span></span>
        <span class="muted">Venda</span><span>${money(p.preco)} → <b>${money(nv)}</b></span></div>
        <label class="chk"><input type="checkbox" data-imprc="${ix}" ${i.atualizaPreco?'checked':''}> Atualizar preço de venda${p.precoManual?' (hoje é manual)':''}</label>`}
    else if(i.acao==='novo'){det=`<div class="imp-new"><div class="field full"><label for="imn${ix}">Nome no catálogo</label><input id="imn${ix}" data-imnome="${ix}" value="${esc(i.nomeNovo)}"></div>
        <div class="field"><label for="imc${ix}">Categoria</label><select id="imc${ix}" data-imcat="${ix}">${CATS.map(c=>`<option value="${c.id}" ${i.catNovo===c.id?'selected':''}>${c.nome}</option>`).join('')}</select></div>
        <div class="field"><label>Custo → venda</label><div class="num" style="padding:9px 0">${money(ce)} → <b>${money(precoSugerido(ce,num(S.empresa.margem)))}</b></div></div></div>`}
    const conf=i.acao==='match'&&CONF[i.confianca]?`<span class="pill conf-${i.confianca}">${CONF[i.confianca]}</span>`:'';
    return `<div class="imp-row ${i.acao==='ignorar'?'off':''}"><div><div class="t">${esc(i.descricao)}</div><div class="d">${i.codigo?`Cód. ${esc(i.codigo)} · `:''}${String(i.qtd).replace('.',',')} × ${money(i.custoUnitario)}</div></div>
      <div class="row" style="flex-wrap:nowrap">${sel}${conf}</div>${det}</div>`;
  };
  const body=document.querySelector('#layer .sheet-b'),foot=document.querySelector('#layer .sheet-f');
  const draw=()=>{
    const nm=R.itens.filter(i=>i.acao==='match').length,nn=R.itens.filter(i=>i.acao==='novo').length,tot=nm+nn;
    body.innerHTML=`<div class="imp-sum"><div><b>${R.itens.length} ite${R.itens.length===1?'m lido':'ns lidos'}</b></div>
      <div class="field"><label for="im_loja">Loja ou distribuidora desta cotação</label><input id="im_loja" value="${esc(R.distribuidora)}" placeholder="Ex.: Loja A"></div>
      <div class="hint">${nm} já no catálogo · ${nn} novo${nn===1?'':'s'}. Confira as associações antes de aplicar.</div>
      ${R.frete>0?`<label class="chk"><input type="checkbox" id="im_rateio" ${R.rateio?'checked':''}> Somar o frete de ${money(R.frete)} ao custo dos itens, proporcional ao valor</label>`:''}</div>
      <div class="imp-list">${R.itens.map(row).join('')}</div>`;
    foot.innerHTML=`<button class="btn left" id="im_back">Voltar</button><button class="btn primary" id="im_apply" ${tot?'':'disabled'}>Aplicar ${tot} ite${tot===1?'m':'ns'}</button>`;
    foot.querySelector('#im_back').onclick=()=>importarCotacao();
    foot.querySelector('#im_apply').onclick=aplicar;
    const rt=body.querySelector('#im_rateio');if(rt)rt.onchange=ev=>{R.rateio=ev.target.checked;draw()};
    const lj=body.querySelector('#im_loja');lj.onchange=ev=>{R.distribuidora=ev.target.value.trim();draw()};
  };
  body.onchange=ev=>{const t=ev.target;
    if(t.dataset.imsel!==undefined){const i=R.itens[+t.dataset.imsel];if(t.value==='__novo')i.acao='novo';else if(t.value==='__ign')i.acao='ignorar';else{i.acao='match';i.produtoId=t.value;i.confianca='manual';const p=byId(t.value);i.atualizaPreco=p?!p.precoManual:true}draw()}
    else if(t.dataset.imprc!==undefined){R.itens[+t.dataset.imprc].atualizaPreco=t.checked;draw()}
    else if(t.dataset.imcat!==undefined){R.itens[+t.dataset.imcat].catNovo=t.value}};
  body.oninput=ev=>{const t=ev.target;if(t.dataset.imnome!==undefined)R.itens[+t.dataset.imnome].nomeNovo=t.value};
  async function aplicar(){
    const b=foot.querySelector('#im_apply');b.disabled=true;b.textContent='Aplicando…';
    const agora=new Date().toISOString(),forn=lojaNome();let up=0,nw=0,fail=0;
    const efs=R.itens.map(custoEf);
    for(const [ix,i] of R.itens.entries()){
      if(i.acao==='ignorar')continue;const ce=Math.round(efs[ix]*100)/100;
      try{
        if(i.acao==='match'){const p=byId(i.produtoId);if(!p)continue;
          const sim=simular(p,ce),nc=Math.round(num(sim.ef.f.preco)*100)/100;
          const o={...p,fornecedores:sim.fs,custo:nc,custoAtualizadoEm:agora,fornecedor:sim.ef.f.nome,codigo:p.codigo||i.codigo||'',historico:[{data:agora,custo:ce,fornecedor:forn},...(p.historico||[])].slice(0,8),atualizadoEm:agora};
          if(i.atualizaPreco){o.preco=precoSugerido(nc,margemDe(p));o.precoManual=false}
          await store.save('produtos',o);up++}
        else{await store.save('produtos',{id:uid(),nome:i.nomeNovo.trim()||i.descricao,categoria:i.catNovo,marca:i.marcaNovo,modelo:i.modeloNovo,codigo:i.codigo,datasheet:'',unidade:i.unNovo,custo:ce,margem:'',preco:precoSugerido(ce,num(S.empresa.margem)),precoManual:false,descricao:'',foto:'',fornecedor:forn,fornecedores:[{id:uid(),nome:forn,preco:ce,link:'',data:agora}],fornecedorFixo:'',custoAtualizadoEm:agora,historico:[{data:agora,custo:ce,fornecedor:forn}],atualizadoEm:agora});nw++}
      }catch(e){fail++}
    }
    impPrev={files:[],txt:'',dist:''};
    closeSheet();render();
    toast(`${up} produto${up===1?' atualizado':'s atualizados'}${nw?`, ${nw} novo${nw===1?'':'s'} no catálogo`:''}${fail?` · ${fail} com erro`:''}`);
  }
  draw();
}

   });

    let bk;try{bk=JSON.parse(await f.text())}catch(err){toast('Esse arquivo não é um backup válido.');return}
    const cols=['produtos','clientes','orcamentos'];
    if(!bk||typeof bk!=='object'||!cols.some(c=>Array.isArray(bk[c]))&&!bk.empresa){toast('Esse arquivo não é um backup da DaylinTech.');return}
    const n=c=>Array.isArray(bk[c])?bk[c].length:0;
    confirmSheet('Restaurar backup?',`O arquivo tem ${n('produtos')} produtos, ${n('clientes')} clientes e ${n('orcamentos')} orçamentos. Ele vai <b>substituir</b> tudo o que está no app agora. Se quiser guardar os dados atuais, exporte um backup antes.`,'Restaurar',async()=>{
      try{
        if(db&&db.importar)await db.importar(bk);
        else if(db){
          for(const c of cols){const novos=Array.isArray(bk[c])?bk[c]:[];const ids=new Set(novos.map(x=>x.id));
            for(const x of S[c].filter(x=>!ids.has(x.id)))await store.remove(c,x.id);
            for(const x of novos)await store.save(c,x)}
          await store.saveEmpresa(bk.empresa||{});
        }else{
          const all={};cols.forEach(c=>all[c]=Array.isArray(bk[c])?bk[c]:[]);all.empresa=bk.empresa||{};if(!lsSet(all)){toast('O navegador não deixou gravar o backup. Libere espaço e tente de novo.');return}
          cols.forEach(c=>S[c]=all[c]);
        }
        S.empresa={...DEF_EMPRESA,...(bk.empresa||{})};render();toast('Backup restaurado');atualizarTextos();
      }catch(err){toast('Não foi possível restaurar. Tente de novo.')}
    });
  };
  $('e_recalc').onclick=async()=>{
    if(!await salvar())return;
    const auto=S.produtos.filter(p=>!p.precoManual&&num(p.custo)>0);
    if(!auto.length){toast('Nenhum produto com preço automático para recalcular.');return}
    confirmSheet('Recalcular preços?',`${auto.length} produto${auto.length===1?'':'s'} com preço automático vão receber o novo preço de venda. Produtos com preço manual não mudam. Orçamentos já feitos continuam com os valores antigos.`,'Recalcular',async()=>{
      let n=0;for(const p of auto){const v=precoSugerido(num(p.custo),margemDe(p));if(v>0&&Math.abs(v-num(p.preco))>0.004){try{await store.save('produtos',{...p,preco:v,atualizadoEm:new Date().toISOString()});n++}catch(err){}}}
      render();toast(n?`${n} preço${n===1?' atualizado':'s atualizados'}`:'Os preços já estavam atualizados');
    });
  };
}

async function salvarOrc(ver){
  if(!draft.clienteId){toast('Escolha o cliente do orçamento.');document.getElementById('o_cli').focus();return}
  if(!draft.itens.length){toast('Adicione pelo menos um item.');return}
  const o={...draft};delete o._dirty;delete o._new;
  if(!o.numero)o.numero=S.orcamentos.reduce((m,x)=>Math.max(m,x.numero||0),0)+1;
  const c=S.clientes.find(c=>c.id===o.clienteId);o.clienteNome=c?c.nome:'';
  o.atualizadoEm=new Date().toISOString();
  try{await store.save('orcamentos',o);toast(draft._new?`Orçamento Nº ${nOrc(o.numero)} criado`:'Orçamento salvo');draft=null;
    if(o.tipo==='os'&&o.agenda)go('os',{id:o.id,force:true});else if(ver)go('proposta',{id:o.id,force:true});else go('inicio',{force:true})}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Limite de armazenamento atingido.':'Não foi possível salvar. Tente de novo.')}
}
function openPicker(mode){

  const list=()=>{
    const ps=S.produtos.filter(p=>doTipo(p)&&(cat==='todas'||(mode==='mo'?(p.grupo||'geral'):p.categoria)===cat)&&(!q||[p.nome,p.marca,p.modelo].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.categoria.localeCompare(b.categoria)||a.nome.localeCompare(b.nome));
    if(!S.produtos.some(doTipo))return mode==='mo'?`<div class="empty"><b>Nenhum serviço cadastrado</b><span>Cadastre a mão de obra na aba Mão de obra.</span><button class="btn primary" id="pk_new">${svg(UI.plus)}Cadastrar serviço</button></div>`:`<div class="empty"><b>Catálogo vazio</b><span>Cadastre produtos na aba Catálogo para adicioná-los aqui.</span><button class="btn primary" id="pk_new">${svg(UI.plus)}Cadastrar produto</button></div>`;

    <div class="chips" id="pk_cats">${[['todas','Todas'],...(mode==='mo'?GRUPOS_MO:CATS_MAT.map(c=>[c.id,c.nome]))].map(([k,l])=>`<button class="chip" data-pkcat="${k}" aria-pressed="${k==='todas'}">${l}</button>`).join('')}</div>

    L=>{
      const refresh=()=>{L.querySelector('#pk_list').innerHTML=list();const nb=L.querySelector('#pk_new');if(nb)nb.onclick=()=>{closeSheet();if(mode==='mo'){go('maodeobra',{force:true});formServ()}else{go('catalogo',{force:true});formProd()}}};

      L.querySelector('#pk_list').addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const p=S.produtos.find(x=>x.id===b.dataset.pick);if(!p)return;
        const it=draft.itens.find(i=>i.produtoId===p.id);
        if(it)it.qtd=num(it.qtd)+1;else draft.itens.push({produtoId:p.id,nome:p.nome,categoria:p.categoria,unidade:p.unidade,descricao:p.descricao||'',datasheet:p.datasheet||'',tempo:isMO(p)?num(p.tempo):'',preco:num(p.preco),custo:num(p.custo),qtd:1});
        draft._dirty=true;refresh();renderEditorParts()});
    });
}

function listaCompras(id){
  const o=S.orcamentos.find(x=>x.id===id);if(!o)return;
  let comprados={...(o.comprados||{})};
  const SEM='Sem loja definida';
  const linhas=o.itens.map((i,ix)=>{const p=S.produtos.find(x=>x.id===i.produtoId);const ef=p&&fornEf(p);const f=ef&&ef.f;
    return {ix,i,p,ef,loja:f?(f.nome||'Loja'):SEM,link:f?safeUrl(f.link):'',unit:f?num(f.preco):num(p?p.custo:i.custo),qtd:num(i.qtd),dias:f?diasDesde(f.data):null}})
    .filter(l=>!isMO(l.i));
  const grupos={};linhas.forEach(l=>{(grupos[l.loja]=grupos[l.loja]||[]).push(l)});
  const ordem=Object.keys(grupos).sort((a,b)=>(a===SEM)-(b===SEM)||a.localeCompare(b));
  const subt=loja=>grupos[loja].reduce((t,l)=>t+l.unit*l.qtd,0);
  const totalHoje=linhas.reduce((t,l)=>t+l.unit*l.qtd,0),previsto=linhas.reduce((t,l)=>t+num(l.i.custo)*l.qtd,0),df=totalHoje-previsto;
  const q=l=>`${String(l.qtd).replace('.',',')} ${l.i.unidade||'un'}`;
  const pedidoTxt=loja=>[`Pedido ${S.empresa.nome}`,...grupos[loja].map(l=>`• ${q(l)} — ${l.i.nome}${l.p&&l.p.codigo?` (cód. ${l.p.codigo})`:''}`)].join('\n');
  const tudoTxt=()=>[`*Compras — orçamento Nº ${nOrc(o.numero)} (${cliNome(o)})*`,...ordem.map(loja=>[``,`*${loja}* — ${money(subt(loja))}`,...grupos[loja].map(l=>`• ${q(l)} — ${l.i.nome}: ${money(l.unit*l.qtd)}${l.link?`\n  ${l.link}`:''}`)].join('\n')),``,`Total: ${money(totalHoje)}`].join('\n');
  const html=()=>{
    const feitos=linhas.filter(l=>comprados[l.ix]).length;
    if(!linhas.length)return `<div class="empty">Este orçamento não tem produtos para comprar.</div>`;
    return `<div class="buy-sum">
      <div class="ln"><span class="muted">Cliente</span><span>${esc(cliNome(o))} · Nº ${nOrc(o.numero)}</span></div>
      <div class="ln"><span class="muted">Total da compra hoje</span><b>${money(totalHoje)}</b></div>
      <div class="ln"><span class="muted">Custo previsto no orçamento</span><span>${money(previsto)}${previsto>0&&Math.abs(df)>0.5?` <span class="delta ${df>0?'up':'down'}">${df>0?'+':'−'}${money(Math.abs(df))}</span>`:''}</span></div>
      <div class="ln"><span class="muted">Já comprados</span><span>${feitos} de ${linhas.length}</span></div></div>
     ${ordem.map(loja=>{const g=grupos[loja];return `<section class="buy-g"><div class="buy-h"><div><b>${esc(loja)}</b> <span class="hint">${g.length} ite${g.length===1?'m':'ns'} · ${money(subt(loja))}</span>${loja===SEM?`<div class="hint">Cadastre onde comprar no produto, na aba Catálogo.</div>`:''}</div>${loja!==SEM?`<button class="btn sm" type="button" data-pedido="${esc(loja)}">${svg(UI.copy)}Copiar pedido</button>`:''}</div>
       ${g.map(l=>`<label class="buy-l ${comprados[l.ix]?'done':''}"><input type="checkbox" data-buy="${l.ix}" ${comprados[l.ix]?'checked':''}><div style="min-width:0"><div class="t">${esc(q(l))} · ${esc(l.i.nome)}</div><div class="d"><span>${money(l.unit)} cada${l.p&&l.p.codigo?` · cód. ${esc(l.p.codigo)}`:''}</span>${idadePill(l.dias)}${l.ef&&l.ef.min.id!==l.ef.f.id?`<span>${esc(l.ef.min.nome)} tem por ${money(l.ef.min.preco)}</span>`:''}${l.link?`<a class="ds" href="${esc(l.link)}" target="_blank" rel="noopener">Abrir na loja ↗</a>`:''}</div></div><span class="v">${money(l.unit*l.qtd)}</span></label>`).join('')}</section>`}).join('')}`;
  };
  openSheet('Lista de compras',html(),`<button class="btn left" id="buy_all">${svg(UI.copy)}Copiar lista completa</button><button class="btn primary" data-act="close">Fechar</button>`,L=>{
    const body=L.querySelector('.sheet-b');
    body.addEventListener('change',async ev=>{const t=ev.target;if(t.dataset.buy===undefined)return;
      if(t.checked)comprados[t.dataset.buy]=true;else delete comprados[t.dataset.buy];
      body.innerHTML=html();
      const cur=S.orcamentos.find(x=>x.id===id);if(!cur)return;
      try{await store.save('orcamentos',{...cur,comprados:{...comprados}})}catch(err){toast('Não foi possível salvar a marcação.')}});
    body.addEventListener('click',ev=>{const b=ev.target.closest('[data-pedido]');if(b){ev.preventDefault();copyText(pedidoTxt(b.dataset.pedido))}});
    L.querySelector('#buy_all').onclick=()=>copyText(tudoTxt());
  });
}
function brandName(n){n=String(n||'');const i=n.toLowerCase().lastIndexOf('tech');return i>0?esc(n.slice(0,i))+'<b>'+esc(n.slice(i))+'</b>':esc(n)}
function propostaTexto(o){
  const e=S.empresa,t=calc(o);
  const L=[`*${e.nome} — Proposta Nº ${nOrc(o.numero)}*`,`Cliente: ${cliNome(o)}`];
  if(o.titulo)L.push(`Projeto: ${o.titulo}`);
  L.push('');
  o.itens.forEach(i=>{L.push(`• ${String(num(i.qtd)).replace('.',',')} ${i.unidade||'un'} — ${i.nome}: ${money(num(i.preco)*num(i.qtd))}`);const pr=S.produtos.find(x=>x.id===i.produtoId);const ds=safeUrl((pr&&pr.datasheet)||i.datasheet);if(ds)L.push(`   Datasheet: ${ds}`)});
  L.push('');
  if(t.mat&&t.mo)L.push(`Materiais: ${money(t.mat)}`,`Mão de obra: ${money(t.mo)}`);
  const totLinha=()=>{if(num(S.empresa.descontoPix)&&pixChave())L.push(`No Pix: ${money(valorPix(t.total))} (${fmtPct(S.empresa.descontoPix)} de desconto)`)};
  if(t.desc)L.push(`Subtotal: ${money(t.sub)}`,`Desconto: −${money(t.desc)}`);
  L.push(`*Total: ${money(t.total)}*`);totLinha();L.push('');
  if(o.pagamento)L.push(`Pagamento: ${o.pagamento}`);
  if(o.prazo)L.push(`Prazo: ${o.prazo}`);
  if(o.garantia)L.push(`Garantia: ${o.garantia}`);
  L.push(`Válida até ${fmtDate(addDays(o.criadoEm,o.validadeDias))}.`);
  if(e.telefone)L.push('',`${e.nome} · ${e.telefone}`);
  return L.join('\n');
}

const soDig=v=>String(v||'').replace(/\D/g,'');
const semAcento=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
const FORMAS={pix:'Pix',cartao:'Cartão de crédito',transferencia:'Transferência',dinheiro:'Dinheiro',combinar:'A combinar'};

const fmtDT=iso=>{if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const localDT=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
function crc16(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF}return crc.toString(16).toUpperCase().padStart(4,'0')}
function pixChave(){const e=S.empresa,k=String(e.pixChave||'').trim();if(!k)return '';const t=e.pixTipo||'cpf';
  if(t==='cpf')return soDig(k);
  if(t==='cel'){const d=soDig(k);return '+'+(d.startsWith('55')&&d.length>11?d:'55'+d)}
  if(t==='email')return k.toLowerCase();
  return k}
function pixPayload(valor,txid){const e=S.empresa,ch=pixChave();if(!ch)return '';
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const nome=semAcento(e.pixNome||e.nome||'DaylinTech').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,25)||'DAYLINTECH';
  const cid=semAcento(e.cidade||'Sao Paulo').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,15)||'SAO PAULO';
  const tx=String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***';
  const p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',ch))+f('52','0000')+f('53','986')+(valor>0?f('54',valor.toFixed(2)):'')+f('58','BR')+f('59',nome)+f('60',cid)+f('62',f('05',tx))+'6304';
  return p+crc16(p)}

function parcelas(total){const e=S.empresa,max=Math.max(1,Math.min(24,Math.round(num(e.cartaoMax)||1))),sj=Math.max(1,Math.round(num(e.cartaoSemJuros)||1)),i=num(e.cartaoJuros)/100,out=[];

  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const a999=n=>{if(!n)return '';if(n===100)return 'cem';const p=[],C=Math.floor(n/100),r=n%100;if(C)p.push(ct[C]);if(r)p.push(r<20?u[r]:(r%10?dz[Math.floor(r/10)]+' e '+u[r%10]:dz[Math.floor(r/10)]));return p.join(' e ')};

// Recibo em PDF: desenha o recibo (com logo e assinatura) numa imagem e põe numa folha A4.
const H2C_SRC='vendor/html2canvas-1.4.1.min.js',JSPDF_SRC='vendor/jspdf-4.2.1.umd.min.js';
const reciboPDF=o=>htmlPDF(reciboHTML(o));
async function htmlPDF(html){
  await loadScript(H2C_SRC);await loadScript(JSPDF_SRC);
  const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:720px;background:#fff;color-scheme:light';
  box.innerHTML=html;document.body.appendChild(box);
  try{
    const el=box.firstElementChild;el.style.boxShadow='none';el.style.margin='0';el.style.maxWidth='none';
    try{await document.fonts.ready}catch(e){}
    await Promise.all([...box.querySelectorAll('img')].map(i=>(i.decode?i.decode():new Promise(r=>{i.onload=i.onerror=r})).catch(()=>{})));
    const top0=el.getBoundingClientRect().top,cortes=[...el.querySelectorAll('.pp-body > *, .pp-table tr')].filter(x=>!x.closest('.os-cob')||x.classList.contains('os-cob')).map(x=>Math.round((x.getBoundingClientRect().top-top0)*2)).sort((a,b)=>a-b);
    const cv=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),pw=190,pxMm=cv.width/pw,pag=Math.floor(277*pxMm);
    for(let y=0,n=0,hp;y<cv.height;y+=hp,n++){hp=Math.min(pag,cv.height-y);
      // Quebra a página antes do último bloco que não cabe inteiro, se houver um bom ponto de corte.
      if(y+hp<cv.height){const c=cortes.filter(v=>v>y+pag*0.4&&v<=y+pag).pop();if(c)hp=c-y}
      const c2=document.createElement('canvas');c2.width=cv.width;c2.height=hp;
      const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c2.width,hp);x.drawImage(cv,0,y,cv.width,hp,0,0,cv.width,hp);
      if(n)pdf.addPage();pdf.addImage(c2.toDataURL('image/jpeg',0.9),'JPEG',10,10,pw,hp/pxMm)}
    return pdf.output('blob');
  }finally{box.remove()}
}

function prazoLimite(o){
  const m=String(o.prazo||'').match(/(\d+)\s*dias?(\s*(úteis|uteis))?/i);if(!m)return null;
  const n=+m[1],uteis=!!m[3],b=new Date((o.aceite&&o.aceite.data)||o.atualizadoEm||Date.now());
  const d=new Date(b.getFullYear(),b.getMonth(),b.getDate(),12);let k=0;
  while(k<n){d.setDate(d.getDate()+1);if(!uteis||(d.getDay()!==0&&d.getDay()!==6))k++}
  return {iso:isoDia(d),n,uteis};
}

// Área de assinatura com o dedo (celular) ou o mouse (computador).
function padAssinatura(cv,aoComecar){
  const ctx=cv.getContext('2d');let desenhando=false,ult=null,sujo=false;
  const k=window.devicePixelRatio||1;cv.width=Math.round(cv.offsetWidth*k);cv.height=Math.round(cv.offsetHeight*k);
  ctx.setTransform(k,0,0,k,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0B1A33';
  const pt=ev=>{const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)*cv.offsetWidth/r.width,y:(ev.clientY-r.top)*cv.offsetHeight/r.height}};
  cv.addEventListener('pointerdown',ev=>{ev.preventDefault();cv.setPointerCapture(ev.pointerId);desenhando=true;ult=pt(ev);aoComecar&&aoComecar()});
  cv.addEventListener('pointermove',ev=>{if(!desenhando)return;const p=pt(ev);ctx.beginPath();ctx.moveTo(ult.x,ult.y);ctx.lineTo(p.x,p.y);ctx.stroke();ult=p;sujo=true});
  const fim=()=>{desenhando=false};cv.addEventListener('pointerup',fim);cv.addEventListener('pointercancel',fim);
  return {limpar(){ctx.clearRect(0,0,cv.width,cv.height);sujo=false},vazio:()=>!sujo,
    png(){const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      if(x1<0)return '';const pd=6;x0=Math.max(0,x0-pd);y0=Math.max(0,y0-pd);x1=Math.min(w-1,x1+pd);y1=Math.min(h-1,y1+pd);
      const cw=x1-x0+1,ch=y1-y0+1,z=Math.min(1,140/ch,520/cw),o=document.createElement('canvas');o.width=Math.round(cw*z);o.height=Math.round(ch*z);
      o.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,o.width,o.height);return o.toDataURL('image/png')}};
}

const addMesesISO=(iso,m)=>{const d=new Date(String(iso).slice(0,10)+'T12:00:00');d.setMonth(d.getMonth()+m);return isoDia(d)};
const addDiasISO=(iso,n)=>{const d=new Date(String(iso).slice(0,10)+'T12:00:00');d.setDate(d.getDate()+n);return isoDia(d)};
const diasAte=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(hojeISO()+'T12:00:00'))/864e5);
const dataBR=iso=>iso?new Date(String(iso).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'';

function dataInstalacao(o){const g=o.agenda||{};return o.instaladoEm||String(g.fim||g.concluidoEm||'').slice(0,10)||(o.status==='concluido'?g.data||'':'')}
function garantiaInfo(o){
  const e=S.empresa,inst=dataInstalacao(o),meses=Math.round(num(e.garantiaEquipMeses)),dias=Math.round(num(e.garantiaServDias)),notas=o.notas||{};
  const mats=(o.itens||[]).map((i,ix)=>({i,ix})).filter(x=>!isMO(x.i));
  const servAte=inst&&dias>0?addDiasISO(inst,dias):'';
  const equipAte=mats.map(x=>{const b=(notas[x.ix]&&notas[x.ix].data)||inst;return b&&meses>0?addMesesISO(b,meses):''}).filter(Boolean).sort().pop()||'';
  const ate=[servAte,equipAte].filter(Boolean).sort().pop()||'';
  return {inst,servAte,equipAte,ate,ativa:!!ate&&ate>=hojeISO(),mats,notas};
}

  const mes=iso=>new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
  const card=(o,cls)=>{const g=o.agenda;return `<div class="ag-card"><div class="ag-d ${cls||''}"><b>${g.data.slice(8,10)}</b><span>${mes(g.data)}</span></div>
    <div class="ag-i"><b>${esc(cliNome(o))}${g.inicio&&!g.fim&&o.status!=='concluido'?' <span class="os-fase" style="font-size:11px">Em andamento</span>':''}</b><span>${esc(cap(diaTxt(g.data,true).split(',')[0]))}${g.hora?` às ${esc(g.hora)}`:''} · ${o.tipo==='os'?`${esc(osTipoNome(o))} · OS`:''} Nº ${nOrc(o.numero)}${o.tipo!=='os'&&o.titulo?` · ${esc(o.titulo)}`:''}</span>${o.motivo?`<span>${esc(o.motivo)}</span>`:''}${g.endereco?`<span>${esc(g.endereco)}</span>`:''}</div>
    <div class="ag-b">${g.endereco?`<a class="btn sm" href="${esc(rotaURL([g.endereco,(S.clientes.find(x=>x.id===o.clienteId)||{}).cep].filter(Boolean).join(', ')))}" target="_blank" rel="noopener">Rota</a>`:''}<button class="btn sm" data-ag-os="${o.id}">OS</button><button class="btn sm" data-ag-wa="${o.id}">WhatsApp</button>${o.status==='concluido'?'':`<button class="btn sm primary" data-ag-ok="${o.id}">Concluir</button>`}</div></div>`};
  const esperaCard=({o,l})=>`<div class="ag-card"><div class="ag-d wait"><b>—</b><span>sem data</span></div>
    <div class="ag-i"><b>${esc(cliNome(o))}</b><span>Nº ${nOrc(o.numero)}${o.titulo?` · ${esc(o.titulo)}`:''}</span><span>${l?(l.iso<hoje?`<b style="color:var(--bad)">Prazo da proposta venceu em ${diaTxt(l.iso)}</b>`:`Agendar até ${esc(diaTxt(l.iso,true))}`):'Sem prazo na proposta'}</span></div>
    <div class="ag-b"><button class="btn sm primary" data-ag-novo="${o.id}">Agendar</button></div></div>`;
  const sec=(tit,html)=>html?`<div><h2 class="h2" style="margin-bottom:10px">${tit}</h2><div class="ag-list">${html}</div></div>`:'';
  const vazio=!ag.length&&!espera.length&&!feitos.length;
  app.innerHTML=`
  <div class="spread"><div><div class="eyebrow">${hj.length?`${hj.length} atendimento${hj.length>1?'s':''} hoje`:'Instalações e visitas'}</div><h1 class="h1">Agenda</h1></div><button class="btn primary" id="ag_nova">${svg(UI.plus)}Nova OS</button></div>
  ${vazio?`<div class="empty"><b>Nenhuma instalação por aqui ainda</b><span class="muted">Quando um cliente aceitar a proposta, ela aparece aqui para você agendar.</span></div>`:''}
  ${sec('Atrasadas',late.map(o=>card(o,'late')).join(''))}
  ${sec('Hoje',hj.map(o=>card(o,'hoje')).join(''))}
  ${sec('Próximas',prox.map(o=>card(o)).join(''))}
  ${sec('Aguardando agendamento',espera.map(esperaCard).join(''))}
  ${sec('Concluídas',feitos.map(o=>card(o,'wait')).join(''))}`;
  const pega=id=>S.orcamentos.find(x=>x.id===id);app.querySelector('#ag_nova').onclick=()=>novaOS();
  app.querySelectorAll('[data-ag-os]').forEach(b=>b.onclick=()=>go('os',{id:b.dataset.agOs}));
  app.querySelectorAll('[data-ag-wa]').forEach(b=>b.onclick=()=>{const o=pega(b.dataset.agWa);mensagemCliente(o,'Confirmar instalação',textoAgenda(o))});
  app.querySelectorAll('[data-ag-ok]').forEach(b=>b.onclick=()=>concluirOS(pega(b.dataset.agOk)));
  app.querySelectorAll('[data-ag-novo]').forEach(b=>b.onclick=()=>agendar(pega(b.dataset.agNovo)));
}
function vProposta(app){
  const o=S.orcamentos.find(x=>x.id===view.id);
  if(!o){app.innerHTML=`<div class="empty"><b>Orçamento não encontrado</b><button class="btn" data-nav="inicio">Voltar</button></div>`;return}
  const t=calc(o),a=o.aceite,p=o.pgto;
  app.innerHTML=`
  <div class="row" style="justify-content:space-between">
    <button class="btn ghost" data-nav="inicio">${svg(UI.back)}Orçamentos</button>
    <div class="row internal">
      <label class="muted" for="st_sel" style="font-size:13px">Status</label>
      <select id="st_sel" class="btn sm" style="padding-right:8px">${Object.entries(STATUS).map(([k,l])=>`<option value="${k}" ${o.status===k?'selected':''}>${l}</option>`).join('')}</select>
    </div>
  </div>
  <div class="profit internal" style="flex-direction:row;flex-wrap:wrap;justify-content:space-between;gap:8px">
    <span>Só você vê: custo ${money(t.custo)} · impostos e despesas ${money(t.taxas)} · lucro líquido <b class="marg ${margCls(t.margem)}">${money(t.lucro)} (${t.margem.toFixed(0)}%)</b>${t.tempo?` · instalação estimada em ${fmtH(t.tempo)}`:''}</span>
    <span class="muted">Ative o Modo cliente antes de mostrar a tela.</span>
  </div>
  <section class="panel internal">
    <div class="spread" style="align-items:center"><h2 class="h2">Fechamento</h2><span class="hint">Aceite, pagamento e recibo</span></div>
    <div class="steps">
      <div class="step ${a?'done':''}"><span class="st-n">${a?'✓':'1'}</span><div class="st-t"><b>Aceite do cliente</b><span class="hint">${a?`${esc(a.nome)} aceitou em ${fmtDT(a.data)} · ${esc(formaTxt(a))}${a.valor?` · ${money(a.valor)}`:''}`:(sb?'Mande o link da proposta: o aceite do cliente aparece aqui sozinho.':'Quando o cliente aceitar pelo WhatsApp, cole a mensagem aqui.')}</span></div><div class="st-b">${a?`<button class="btn sm primary" id="fx_msg">Mensagem</button>`:''}<button class="btn sm ${a?'':'primary'}" id="fx_ac">${a?'Editar':'Registrar aceite'}</button></div></div>
      <div class="step ${p?'done':''}"><span class="st-n">${p?'✓':'2'}</span><div class="st-t"><b>Pagamento</b><span class="hint">${p?`${money(p.valor)} via ${esc(formaTxt(p))} em ${fmtDate(p.data+'T12:00:00')}${p.tipo==='parcial'?' · parcial':''}`:'Registre quando o dinheiro entrar.'}</span></div><button class="btn sm ${a&&!p?'primary':''}" id="fx_pg">${p?'Editar':'Registrar pagamento'}</button></div>
      <div class="step"><span class="st-n">3</span><div class="st-t"><b>Recibo</b><span class="hint">${p?'Pronto, com sua assinatura.':'Liberado depois do pagamento.'}</span></div><button class="btn sm ${p?'primary':''}" id="fx_rc" ${p?'':'disabled'}>Ver recibo</button></div>
      <div class="step ${o.agenda?'done':''}"><span class="st-n">${o.agenda?'✓':'4'}</span><div class="st-t"><b>Agendamento</b><span class="hint">${o.agenda?`${esc(cap(diaTxt(o.agenda.data,true)))}${o.agenda.hora?` às ${esc(o.agenda.hora)}`:''}${o.status==='concluido'?' · concluído':''}`:(()=>{const l=prazoLimite(o);return a||vendido(o)?(l?`Prazo da proposta: até ${diaTxt(l.iso)}.`:'Marque a data da instalação.'):'Liberado depois do aceite.'})()}</span></div>
        <div class="st-b">${o.agenda?`<button class="btn sm" id="fx_ag">Editar</button><button class="btn sm primary" id="fx_os">Ver OS</button>`:`<button class="btn sm ${a||vendido(o)?'primary':''}" id="fx_ag">Agendar</button>`}</div></div>
      ${(()=>{const gi=garantiaInfo(o),ok=gi.inst&&(!gi.mats.length||gi.mats.every(x=>gi.notas[x.ix]&&gi.notas[x.ix].nf));return `<div class="step ${ok?'done':''}"><span class="st-n">${ok?'✓':'5'}</span><div class="st-t"><b>Compras e garantia</b><span class="hint">${gi.inst?`${gi.ativa?`Em garantia até ${dataBR(gi.ate)}`:'Garantia vencida'}${gi.mats.some(x=>!(gi.notas[x.ix]&&gi.notas[x.ix].nf))?' · falta anotar nota fiscal':''}`:'Notas fiscais dos materiais e prazo da garantia.'}</span></div>
        <div class="st-b"><button class="btn sm ${vendido(o)&&!ok?'primary':''}" type="button" data-act="garantia" data-id="${o.id}">${gi.inst||Object.keys(gi.notas).length?'Abrir':'Anotar notas'}</button></div></div>`})()}
    </div>
    ${pixChave()?'':`<p class="note" style="margin:0">Cadastre sua chave Pix e seu WhatsApp na aba Empresa para a proposta mostrar o QR Code e o botão de aceite.</p>`}
  </section>
  <div class="paper-wrap">${propostaHTML(o)}<div class="paper pp-extra"><div class="pp-body" id="pp_pay"><span class="hint">Carregando formas de pagamento…</span></div></div></div>
  <div class="actions">
    ${sb?`<button class="btn ${vendido(o)?'':'primary'}" id="pp_link">${svg(UI.copy)}Link da proposta</button>`:''}
    <button class="btn ${vendido(o)||sb?'':'primary'}" id="pp_dl">${svg(UI.dl)}Baixar proposta com aceite</button>
    <button class="btn ${vendido(o)&&o.status!=='concluido'?'primary':''} internal" id="pp_buy">${svg(UI.cart)}Lista de compras</button>
    <button class="btn" id="pp_copy">${svg(UI.copy)}Copiar para WhatsApp</button>
    <button class="btn internal" id="pp_edit">${svg(UI.edit)}Editar</button>
    <button class="btn internal" id="pp_dup">${svg(UI.dup)}Duplicar</button>
    <button class="btn danger internal" id="pp_del">${svg(UI.trash)}Excluir</button>
  </div>`;
  const $=id=>app.querySelector('#'+id);
  pagamentoHTML(o).then(h=>{const el=$('pp_pay');if(el)el.innerHTML=h});
  $('st_sel').onchange=async e=>{try{await store.save('orcamentos',{...o,status:e.target.value,atualizadoEm:new Date().toISOString()});toast(e.target.value==='aprovado'?'Aprovado! Veja a lista de compras.':'Status: '+STATUS[e.target.value])}catch(err){toast('Não foi possível alterar o status.')}};
  $('fx_ac').onclick=()=>registrarAceite(o);
  if(a)$('fx_msg').onclick=()=>mensagemCliente(o);
  $('fx_ag').onclick=()=>agendar(o);if(o.agenda)$('fx_os').onclick=()=>go('os',{id:o.id});
  if(sb)$('pp_link').onclick=async()=>{const b=$('pp_link');b.disabled=true;try{await linkProposta(o)}catch(e){toast('Não foi possível criar o link. Confira a internet e tente de novo.')}finally{b.disabled=false}};
  $('fx_pg').onclick=()=>registrarPagamento(o);
  $('fx_rc').onclick=()=>verRecibo(o.id);
  $('pp_copy').onclick=()=>copyText(propostaTexto(o));
  $('pp_buy').onclick=()=>listaCompras(o.id);
  $('pp_edit').onclick=()=>editarOrc(o);
  $('pp_dup').onclick=()=>{const c=JSON.parse(JSON.stringify(o));delete c.aceite;delete c.pgto;delete c.comprados;delete c.linkToken;delete c.linkPagamento;delete c.agenda;draft={...c,id:uid(),numero:null,status:'rascunho',criadoEm:new Date().toISOString(),_dirty:true,_new:true};go('editor',{force:true})};
  $('pp_del').onclick=()=>confirmSheet('Excluir orçamento?',`O orçamento Nº ${nOrc(o.numero)} de ${esc(cliNome(o))} será apagado.`,'Excluir',async()=>{if(sb){try{await sb.from('propostas').delete().eq('orcamento_id',o.id)}catch(e){}try{const {data}=await sb.storage.from(FOTOS_BUCKET).list(o.id);if(data&&data.length)await sb.storage.from(FOTOS_BUCKET).remove(data.map(f=>o.id+'/'+f.name))}catch(e){}}await store.remove('orcamentos',o.id);toast('Orçamento excluído');go('inicio',{force:true})});
  $('pp_dl').onclick=async()=>{
    const b=$('pp_dl');b.disabled=true;
    try{const pay=await pagamentoHTML(o);
      const dados=JSON.stringify(dadosCliente(o)).replace(/</g,'\\u003c');
      const body=`${propostaHTML(o)}<div class="paper pp-extra"><div class="pp-body">${pay}${aceiteHTML(o)}</div></div><script id="dados" type="application/json">${dados}<\/script>`;
      const ok=await baixar(`Proposta-${nOrc(o.numero)}-${arqNome(cliNome(o))}.html`,docHTML(`Proposta ${nOrc(o.numero)} — ${cliNome(o)}`,body,`<script>${CLIENT_JS}<\/script>`));
      if(ok){toast('Proposta salva. Mande o arquivo pelo WhatsApp para o cliente.');if(o.status==='rascunho'){try{await store.save('orcamentos',{...o,status:'enviado',atualizadoEm:new Date().toISOString()})}catch(e){}}}
    }finally{b.disabled=false}
  };
}

/* ---------- Eventos globais ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return;
  const cpy=e.target.closest('[data-copy]');if(cpy){copyText(cpy.dataset.copy);return}
  const t=e.target.closest('[data-nav],[data-act],[data-status],[data-cat],[data-open-orc],[data-edit-prod],[data-edit-cli],[data-q],[data-rm],[data-grupo],[data-close-scrim]');
  if(!t)return;
  if(t.hasAttribute('data-close-scrim')){if(e.target===t)closeSheet();return}
  if(t.dataset.nav){closeSheet();ui.busca='';go(t.dataset.nav);return}
  const a=t.dataset.act;
  if(a==='close'){closeSheet();return}
  if(a==='novo-orc'){novoOrc();return}
  if(a==='novo-prod'){formProd();return}
  if(a==='novo-serv'){formServ();return}
  if(a==='importar'){importarCotacao();return}
  if(a==='padronizar'){padronizarNomes();return}
  if(a==='garantia'){const o=S.orcamentos.find(x=>x.id===t.dataset.id);if(o)garantiaSheet(o);return}
  if(a==='importar-home'){go('catalogo');importarCotacao();return}
  if(a==='novo-cli'){formCli();return}
  if(t.dataset.status){ui.status=t.dataset.status;render();return}
  if(t.dataset.cat){ui.cat=t.dataset.cat;render();return}
  if(t.dataset.grupo){ui.grupo=t.dataset.grupo;render();return}
  if(t.dataset.openOrc){closeSheet();const oo=S.orcamentos.find(x=>x.id===t.dataset.openOrc);go(oo&&oo.tipo==='os'&&oo.agenda?'os':'proposta',{id:t.dataset.openOrc});return}
  if(t.dataset.editProd){const pr=S.produtos.find(p=>p.id===t.dataset.editProd);(isMO(pr)?formServ:formProd)(pr);return}
  if(t.dataset.editCli){formCli(S.clientes.find(c=>c.id===t.dataset.editCli));return}
  if(t.dataset.q!==undefined&&draft){const i=draft.itens[+t.dataset.q];i.qtd=Math.max(1,num(i.qtd)+(+t.dataset.d));draft._dirty=true;renderEditorParts();return}
  if(t.dataset.rm!==undefined&&draft){draft.itens.splice(+t.dataset.rm,1);draft._dirty=true;renderEditorParts();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('layer').innerHTML){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.li,.card')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='buscaOrc'||id==='buscaProd'){ui.busca=e.target.value;render();return}
  if(id==='buscaMO'){ui.buscaMO=e.target.value;render();return}
  if(id==='buscaCli'){ui.buscaCli=e.target.value;render();return}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.qi!==undefined&&draft){const i=draft.itens[+e.target.dataset.qi];i.qtd=Math.max(0.01,num(e.target.value)||1);draft._dirty=true;renderEditorParts()}
});

/* Modo cliente */
const pb=document.getElementById('presentBtn');
function setPresent(on){document.body.classList.toggle('apresentacao',on);pb.setAttribute('aria-pressed',on);try{localStorage.setItem('daylintech:present',on?'1':'0')}catch(e){}}
pb.onclick=()=>setPresent(pb.getAttribute('aria-pressed')!=='true');
try{setPresent(localStorage.getItem('daylintech:present')==='1')}catch(e){}

render();
initStore();
})();
</script>
